---
version: 1.0
name: update_genomic_elements
description: Workflow to create regulatory elements files for clustering and create informative (phenotype, dosage sensitivity ...) annotationtracks and update the annotationtracks in Gens


input:
  - hosts
  - cwd
  - regulatoryfileurl
  - MANEfileurl
  - genefileurl


vars:
 - msg:
 - annotationtracks:


tasks:
  get_regulatory_data:
    action: annotationtracks.regulatory_data
    input:
      regulatoryfileurl: <% ctx().regulatoryfileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% result().result %>
        do:
          - get_gene_data
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure

  get_gene_data:
    action: annotationtracks.gene_data
    input:
      MANEfileurl: <% ctx().MANEfileurl %>
      genefileurl: <% ctx().genefileurl %>
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - upload_into_gens
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure

  upload_into_gens:
    action: annotationtracks.upload_tracks_to_gens
    input:
      annotationtracks: <% ctx().annotationtracks %>
      timeout: 10000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied and uploaded to Gens"
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  report_failure:
    action: core.inject_trigger
    input:
      trigger_name: gmc_norr_analysis.email_notification
      payload:
        subject: >
          Failed to update annotationtracks in Gens
        message: <% ctx().msg %>
    next:
      - when: "{{ succeeded() }}"
        do: fail
        