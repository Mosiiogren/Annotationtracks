---
version: 1.0
name: update_informative_tracks_gens
description: Workflow to create informative (phenotype, dosage sensitivity ...) annotationtracks and update the annotationtracks in Gens


input:
  - hosts
  - cwd


vars:
 - msg:
 - annotationtracks:


tasks:
  get_acmg_genes:
    action: annotationtracks.acmg_genes
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% result().result %>
        do:
          - get_disease_related_variants
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure

  get_disease_related_variants:
    action: annotationtracks.disease_related_variants
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - get_phenotype_data
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
    
  get_phenotype_data:
    action: annotationtracks.clinical_significance
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - get_dosage_sensitivity
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  get_dosage_sensitivity:
    action: annotationtracks.dosage_sensitivity
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - get_public_variants
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  get_public_variants:
    action: annotationtracks.public_variants
    input:
      timeout: 1000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - segment_duplication
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  segment_duplication:
    action: annotationtracks.segment_duplications
    input:
      timeout: 1000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - annotationtracks: <% ctx().annotationtracks + result().result %>
        do:
          - upload_into_gens
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure

  upload_into_gens:
    action: annotationtracks.upload_tracks_to_gens
    input:
      annotationtracks: <% ctx().annotationtracks %>
      timeout: 10000
    next:
      - when: "{{ succeeded() }}"
        publish:
          - msg: "Annotationtracks has been copied and uploaded to Gens"
      - when: "{{ failed() }}"
        publish:
          - msg: <% result().get(ctx().hosts).stderr %>
        do:
          - report_failure
  
  report_failure:
    action: core.inject_trigger
    input:
      trigger_name: gmc_norr_analysis.email_notification
      payload:
        subject: >
          Failed to update annotationtracks in Gens
        message: <% ctx().msg %>
    next:
      - when: "{{ succeeded() }}"
        do: fail
        